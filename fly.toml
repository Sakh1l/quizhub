app = "quizhub-cc"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  QUIZHUB_PORT = "8080"
  QUIZHUB_DB = "/app/data/quizhub.db"
  QUIZHUB_TRUST_PROXY = "true"

[mounts]
  source = "quizhub_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
