<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Buddy Tour</title>
<style>
  :root {
    --bg: #fdfbf7; --panel: #ffffff; --ink: #2c2a3a; --muted: #6b6880;
    --accent: #7a5cff; --accent-soft: #efeaff; --warm: #ffb86b;
    --good: #30c48d; --bad: #ff6b6b; --line: #ece8de;
    --code-bg: #f5f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1820; --panel: #24222e; --ink: #f1eef9; --muted: #a8a4bd;
      --accent: #a48cff; --accent-soft: #2e2944; --warm: #ffc98a;
      --line: #34303f; --code-bg: #1f1d28;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    line-height: 1.55; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }
  pre.code { background: var(--code-bg); padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; position: relative; }
  pre.code code { background: transparent; padding: 0; }
  pre.code .copy { position: absolute; top: 8px; right: 8px; font-size: 11px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 8px; cursor: pointer; color: var(--muted); }
  pre.code .copy:hover { color: var(--ink); }
  blockquote { border-left: 4px solid var(--accent-soft); margin: 1em 0;
    padding: 4px 12px; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
  h1,h2,h3,h4 { line-height: 1.25; }

  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font-weight: 700; font-size: 18px; margin-bottom: 6px; }
  .brand .emoji { font-size: 22px; margin-right: 6px; }
  .repo { font-size: 12px; color: var(--muted); margin-bottom: 12px;
    word-break: break-word; }

  .xp-wrap { background: var(--accent-soft); border-radius: 999px; height: 8px;
    overflow: hidden; margin: 10px 0 4px; }
  .xp-bar { background: var(--accent); height: 100%; width: 0%; transition: width .3s ease; }
  .xp-text { font-size: 11px; color: var(--muted); margin-bottom: 14px; }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .nav button:hover { background: var(--accent-soft); }
  .nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .check { margin-left: auto; opacity: 0; transition: opacity .2s; }
  .nav button.done .check { opacity: 1; color: var(--good); }
  .nav .empty-tag { font-size: 10px; color: var(--muted); margin-left: auto; }

  .search { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 13px; margin-bottom: 12px; }

  .main { padding: 32px 48px; max-width: 920px; }
  .crumb { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .pageTitle { display: flex; align-items: center; gap: 12px; font-size: 28px;
    margin: 0 0 8px; }
  .pageTitle .icon { font-size: 32px; }
  .src-link { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .summary { font-size: 16px; color: var(--muted); margin-bottom: 20px; }

  .content { font-size: 15px; }
  .content h1 { font-size: 22px; margin-top: 1.4em; }
  .content h2 { font-size: 18px; margin-top: 1.4em; }
  .content h3 { font-size: 16px; margin-top: 1.2em; }
  .content ul, .content ol { padding-left: 22px; }
  .content li { margin: 4px 0; }

  .empty { padding: 18px; background: var(--accent-soft); border-radius: 10px;
    color: var(--ink); }

  table.md-table { border-collapse: collapse; width: 100%; margin: 14px 0;
    font-size: 14px; display: block; overflow-x: auto; }
  table.md-table th, table.md-table td { border: 1px solid var(--line);
    padding: 8px 12px; vertical-align: top; }
  table.md-table thead { background: var(--accent-soft); }
  table.md-table th { font-weight: 600; color: var(--ink); }
  table.md-table tbody tr:nth-child(even) { background: rgba(122,92,255,0.04); }

  /* TL;DR card at top of each section */
  .tldr { background: var(--accent-soft); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 12px 16px; margin: 0 0 22px;
    font-size: 15px; color: var(--ink); }
  .tldr .label { font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }

  /* Accordion sections */
  .content details { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px 16px; margin: 10px 0;
    transition: box-shadow .2s; }
  .content details[open] { box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .content details > summary { cursor: pointer; padding: 12px 0;
    font-weight: 600; font-size: 16px; list-style: none;
    display: flex; align-items: center; gap: 10px; }
  .content details > summary::-webkit-details-marker { display: none; }
  .content details > summary::before { content: "▸"; color: var(--accent);
    transition: transform .2s; display: inline-block; }
  .content details[open] > summary::before { transform: rotate(90deg); }
  .content details > summary:hover { color: var(--accent); }
  .content details > .acc-body { padding: 0 0 12px; }

  /* Link cards (Curated Links page) */
  .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 720px) { .link-grid { grid-template-columns: 1fr; } }
  .link-card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; transition: transform .15s, box-shadow .15s; }
  .link-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  .link-card .title { font-weight: 600; margin-bottom: 4px; display: flex;
    align-items: center; gap: 8px; }
  .link-card .desc { color: var(--muted); font-size: 13px; margin: 6px 0 8px; }
  .link-card .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; background: var(--accent-soft); color: var(--accent); }
  .pill.must { background: rgba(255,184,107,0.2); color: #b07028; }
  .pill.optional { background: rgba(168,164,189,0.2); color: var(--muted); }

  .actions { display: flex; gap: 10px; margin: 28px 0 16px; flex-wrap: wrap; }
  .btn { all: unset; cursor: pointer; padding: 10px 16px; border-radius: 999px;
    background: var(--accent); color: white; font-size: 14px; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--accent);
    border: 1px solid var(--accent); }
  .btn.warm { background: var(--warm); color: #2c2a3a; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 11px;
    font-weight: 600; margin-right: 6px; }
  .badge.good { background: rgba(48,196,141,0.15); color: var(--good); }

  .footer { font-size: 11px; color: var(--muted); margin-top: 40px;
    border-top: 1px solid var(--line); padding-top: 14px; }

  /* Quiz */
  .quiz-q { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin: 12px 0; }
  .quiz-q .q { font-weight: 600; margin-bottom: 10px; }
  .quiz-q .opt { display: block; padding: 8px 10px; border-radius: 6px;
    cursor: pointer; margin: 4px 0; }
  .quiz-q .opt:hover { background: var(--accent-soft); }
  .quiz-q .opt.right { background: rgba(48,196,141,0.15); color: var(--good); }
  .quiz-q .opt.wrong { background: rgba(255,107,107,0.15); color: var(--bad); }
  .quiz-score { font-size: 18px; font-weight: 700; margin-top: 18px; }

  /* Search results */
  mark { background: #fff2a8; color: #2c2a3a; padding: 0 2px; border-radius: 2px; }
  .search-hits { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .main { padding: 22px 18px; }
  }
</style>
</head>

<script type="application/json" id="buddy-data">{"meta":{"repoName":"quizhub","repoRoot":"/home/sak/Projects/quizhub/quizhub","lastIndexedCommit":"a9877cfda4c6a647ef3a6e4cbadedd3553894f2e","lastRunTimestamp":"2026-05-24T07:55:28Z","generatedAt":"2026-05-24T07:57:24.161Z","linksCount":0},"sections":[{"id":"welcome","icon":"👋","title":"Welcome","source":"README_FOR_HUMANS.md","hasContent":true,"summary":"Hi — I'm Buddy. This is the friendly home page for this repo.","html":"\u003ch1>Welcome! 👋\u003c/h1>\n\u003cp>Hi — I&#39;m Buddy. This is the friendly home page for this repo. I write short notes so a new contributor can get started fast.\u003c/p>\n\u003chr/>\n\u003ch2>What is this project?\u003c/h2>\n\u003cp>QuizHub is a small real-time multiplayer trivia game. It runs as one Go binary. The server embeds the frontend and uses an embedded SQLite DB. Players join by a room code. An admin creates quizzes via an admin page.\u003c/p>\n\u003cul>\u003cli>What it does: run quiz games for players and a host.\u003c/li>\u003cli>Who uses it: demos, small teams, learning projects.\u003c/li>\u003cli>Why it exists: simple, self-contained live quiz app you can run anywhere.\u003c/li>\u003c/ul>\n\u003ch2>Big-picture ideas\u003c/h2>\n\u003cul>\u003cli>Single Go binary with frontend embedded (go:embed).\u003c/li>\u003cli>Real-time sync via WebSockets (hub in internal/ws).\u003c/li>\u003cli>Data stored in an embedded SQLite DB (no external DB).\u003c/li>\u003c/ul>\n\u003ch2>Quick actions (what to do first)\u003c/h2>\n\u003col>\u003cli>Open the detailed setup: .buddy/GETTING_STARTED.md\u003c/li>\u003cli>Build and run locally: \u003ccode>make build\u003c/code> then \u003ccode>./quizhub\u003c/code> (see README.md)\u003c/li>\u003cli>See the admin UI: http://localhost:8080/admin.html (PIN: 1234)\u003c/li>\u003cli>Read code entry: cmd/server/main.go → internal/handlers/handlers.go → internal/ws/hub.go\u003c/li>\u003c/ol>\n\u003ch2>Where to look in the code (start here)\u003c/h2>\n\u003cul>\u003cli>Entry point: cmd/server/main.go\u003c/li>\u003cli>HTTP handlers: internal/handlers/handlers.go\u003c/li>\u003cli>DB layer: internal/db/db.go\u003c/li>\u003cli>WebSocket hub: internal/ws/hub.go\u003c/li>\u003cli>Embedded frontend: web/static/\u003cem>.html, web/static/\u003c/em>.js, web/embed.go\u003c/li>\u003cli>Build &amp; CI: Makefile, Dockerfile, .github/workflows/go.yml\u003c/li>\u003c/ul>\n\u003ch2>Next steps\u003c/h2>\n\u003cul>\u003cli>Run \u003ccode>make build\u003c/code> and \u003ccode>./quizhub\u003c/code> to see it live.\u003c/li>\u003cli>Open \u003ccode>.buddy/GETTING_STARTED.md\u003c/code> for exact commands.\u003c/li>\u003cli>If something in these notes looks wrong, run: \u003ccode>buddy scan\u003c/code> or ask &quot;Update buddy&quot;.\u003c/li>\u003c/ul>\n\u003chr/>\n\u003cp>If you want, I can now update the other Buddy files (GETTING_STARTED, ARCHITECTURE, MAPs, TECH_STACK) with details from the repo. Say &quot;Yes — update the rest&quot; to proceed.\u003c/p>"},{"id":"tech","icon":"🧰","title":"Tech Stack","source":"TECH_STACK.md","hasContent":true,"summary":"Collected from go.mod, frontend package.json, Makefile and Dockerfile.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Tech Stack\u003c/h1>\n\u003cp>Collected from go.mod, frontend package.json, Makefile and Dockerfile.\u003c/p>\n\u003ch2>Languages\u003c/h2>\n\u003cul>\u003cli>Go 1.24+ (main application and server)\u003c/li>\u003cli>JavaScript (small frontend, vanilla)\u003c/li>\u003c/ul>\n\u003ch2>Libraries / notable deps\u003c/h2>\n\u003cul>\u003cli>modernc.org/sqlite — pure-Go SQLite driver\u003c/li>\u003cli>github.com/gorilla/websocket — WebSocket handling\u003c/li>\u003cli>github.com/google/uuid — UUIDs\u003c/li>\u003cli>Frontend: \u003ccode>serve\u003c/code> (npm) used only for local static preview (package.json)\u003c/li>\u003c/ul>\n\u003ch2>Build &amp; packaging\u003c/h2>\n\u003cul>\u003cli>Makefile targets: build (go build), run, test, cover\u003c/li>\u003cli>Dockerfile: multi-stage build (golang:1.24 → alpine)\u003c/li>\u003c/ul>\n\u003ch2>Tests\u003c/h2>\n\u003cul>\u003cli>Go unit tests: \u003ccode>go test ./...\u003c/code> (Makefile: test)\u003c/li>\u003c/ul>\n\u003ch2>CI\u003c/h2>\n\u003cul>\u003cli>GitHub Actions workflow at .github/workflows/go.yml (runs tests and build)\u003c/li>\u003c/ul>\n\u003cp>Notes: No heavy JS framework or bundler. The frontend is embedded in the Go binary via go:embed.\u003c/p>"},{"id":"map","icon":"🗺️","title":"Repo Map","source":"MAP/repo_map.md","hasContent":true,"summary":"A quick tour of the main folders and where to begin reading code.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Repo Map\u003c/h1>\n\u003cp>A quick tour of the main folders and where to begin reading code.\u003c/p>\n\u003ch2>Top-level folders\u003c/h2>\n\u003ctable class=\"md-table\">\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Folder\u003c/th>\u003cth style=\"text-align:left\">Purpose\u003c/th>\u003cth style=\"text-align:left\">Start here?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">cmd/\u003c/td>\u003ctd style=\"text-align:left\">Application entry points\u003c/td>\u003ctd style=\"text-align:left\">cmd/server/main.go\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">internal/\u003c/td>\u003ctd style=\"text-align:left\">Core server code (db, handlers, middleware, ws, models)\u003c/td>\u003ctd style=\"text-align:left\">internal/handlers/handlers.go\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">web/\u003c/td>\u003ctd style=\"text-align:left\">Embedded static assets and embed.go (go:embed)\u003c/td>\u003ctd style=\"text-align:left\">web/static/ and web/embed.go\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">frontend/\u003c/td>\u003ctd style=\"text-align:left\">Optional frontend dev helpers / package.json (serve)\u003c/td>\u003ctd style=\"text-align:left\">frontend/package.json\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">.github/\u003c/td>\u003ctd style=\"text-align:left\">CI workflows and repo automation\u003c/td>\u003ctd style=\"text-align:left\">.github/workflows/go.yml\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">.buddy/\u003c/td>\u003ctd style=\"text-align:left\">Buddy docs (this folder)\u003c/td>\u003ctd style=\"text-align:left\">.buddy/README_FOR_HUMANS.md\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Dockerfile, Makefile\u003c/td>\u003ctd style=\"text-align:left\">Build and deploy helpers\u003c/td>\u003ctd style=\"text-align:left\">See Makefile for build/test commands\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Where to start reading code\u003c/h2>\n\u003col>\u003cli>cmd/server/main.go — program entry; wires everything.\u003c/li>\u003cli>internal/handlers/handlers.go — HTTP routes and business logic.\u003c/li>\u003cli>internal/db/db.go — migrations and data access.\u003c/li>\u003cli>internal/ws/hub.go — WebSocket hub and message broadcasting.\u003c/li>\u003cli>web/static — frontend HTML/CSS/JS (player/admin UIs).\u003c/li>\u003c/ol>\n\u003cp>If you want a small change, pick a handler or a DB function and run \u003ccode>make test\u003c/code> locally.\u003c/p>"},{"id":"entry","icon":"🚪","title":"Entry Points","source":"MAP/entry_points.md","hasContent":true,"summary":"| Entry | File | What it does |","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Entry Points\u003c/h1>\n\u003ctable class=\"md-table\">\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Entry\u003c/th>\u003cth style=\"text-align:left\">File\u003c/th>\u003cth style=\"text-align:left\">What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">Server (main)\u003c/td>\u003ctd style=\"text-align:left\">cmd/server/main.go\u003c/td>\u003ctd style=\"text-align:left\">Builds DB, WebSocket hub, handlers, middleware; serves embedded static files.\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Frontend preview\u003c/td>\u003ctd style=\"text-align:left\">frontend/package.json (script: start)\u003c/td>\u003ctd style=\"text-align:left\">\u003ccode>npx serve public -l 3000\u003c/code> — local preview of static files (dev only).\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Docker build\u003c/td>\u003ctd style=\"text-align:left\">Dockerfile\u003c/td>\u003ctd style=\"text-align:left\">Multi-stage image to produce a small runtime container.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>Short note: run \u003ccode>make build\u003c/code> or \u003ccode>go build -o quizhub ./cmd/server\u003c/code> to build the binary. \u003ccode>make run\u003c/code> runs it.\u003c/p>"},{"id":"flow","icon":"🔁","title":"Data Flow","source":"MAP/data_flow.md","hasContent":true,"summary":"Simple end-to-end flows with file pointers.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Data Flow\u003c/h1>\n\u003cp>Simple end-to-end flows with file pointers.\u003c/p>\n\u003ch2>Admin creates a room\u003c/h2>\n\u003col>\u003cli>Admin UI calls \u003ccode>POST /api/admin/auth\u003c/code> to get a token (internal/handlers.AdminAuth).\u003c/li>\u003cli>Admin calls \u003ccode>POST /api/room/create\u003c/code> (handlers.CreateRoom) → generate room code (handlers.generateRoomCode) → DB.CreateRoom stores code and resets state (internal/db/db.go).\u003c/li>\u003cli>Hub broadcasts \u003ccode>room_created\u003c/code> event (internal/ws/hub.go).\u003c/li>\u003c/ol>\n\u003ch2>Player joins a room\u003c/h2>\n\u003col>\u003cli>Player posts to \u003ccode>POST /api/join\u003c/code> with nickname and room_code (handlers.Join).\u003c/li>\u003cli>handlers.Join calls DB.CreatePlayer and broadcasts \u003ccode>player_joined\u003c/code> via hub.\u003c/li>\u003cli>Player opens WebSocket \u003ccode>/api/ws?role=player&amp;player_id=...\u003c/code> to receive events.\u003c/li>\u003c/ol>\n\u003ch2>Game start and answers\u003c/h2>\n\u003col>\u003cli>Admin selects questions and calls \u003ccode>POST /api/game/start\u003c/code> (handlers.StartGame) which calls DB.StartGame.\u003c/li>\u003cli>handlers.startQuestion broadcasts \u003ccode>new_question\u003c/code> and sets a server-side timer.\u003c/li>\u003cli>Players submit answers to \u003ccode>POST /api/answer\u003c/code> (handlers.Answer) → DB.SubmitAnswer / RecordAnswer updates answers and scores.\u003c/li>\u003cli>After time limit, handlers triggers \u003ccode>time_up\u003c/code>; admin can call \u003ccode>POST /api/game/next\u003c/code> to advance.\u003c/li>\u003c/ol>\n\u003cp>These flows show where to look in handlers and DB files for logic.\u003c/p>"},{"id":"getting","icon":"🚀","title":"Get It Running","source":"GETTING_STARTED.md","hasContent":true,"summary":"Short and exact steps to run the project locally.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Getting Started\u003c/h1>\n\u003cp>Short and exact steps to run the project locally.\u003c/p>\n\u003ch2>Prerequisites\u003c/h2>\n\u003cul>\u003cli>Go 1.24+ (required to build the binary)\u003c/li>\u003cli>Docker (optional, recommended for container runs)\u003c/li>\u003cli>(Node is only used for a lightweight frontend dev server; not required to run the Go binary)\u003c/li>\u003c/ul>\n\u003ch2>Clone &amp; build\u003c/h2>\n\u003cpre class=\"code\">\u003ccode data-lang=\"bash\">git clone https://github.com/sakh1l/quizhub.git\ncd quizhub\nmake build    # builds the quizhub binary (uses: go build -o quizhub ./cmd/server)\u003c/code>\u003c/pre>\n\u003ch2>Run locally\u003c/h2>\n\u003cpre class=\"code\">\u003ccode data-lang=\"bash\"># run the built binary\n./quizhub\n# or with Makefile shortcut\nmake run\u003c/code>\u003c/pre>\n\u003cp>Open in browser:\u003c/p>\n\u003cul>\u003cli>Players: http://localhost:8080\u003c/li>\u003cli>Admin:   http://localhost:8080/admin.html  (PIN: 1234)\u003c/li>\u003c/ul>\n\u003ch2>Run tests\u003c/h2>\n\u003cpre class=\"code\">\u003ccode data-lang=\"bash\">make test        # runs `go test ./... -v -count=1`\nmake cover       # coverage report (go tool cover -html=coverage.out)\u003c/code>\u003c/pre>\n\u003ch2>Docker (quick)\u003c/h2>\n\u003cpre class=\"code\">\u003ccode data-lang=\"bash\">docker build -t quizhub .\ndocker run -d -p 8080:8080 -v quizhub-data:/app/data -e QUIZHUB_ADMIN_PIN=your-pin quizhub\u003c/code>\u003c/pre>\n\u003ch2>Common env vars (where to set them)\u003c/h2>\n\u003cul>\u003cli>QUIZHUB_PORT (default: 8080) — used in cmd/server/main.go\u003c/li>\u003cli>QUIZHUB_DB (default: quizhub.db) — SQLite file path\u003c/li>\u003cli>QUIZHUB_ADMIN_PIN (default: 1234) — admin PIN\u003c/li>\u003cli>QUIZHUB_ALLOWED_ORIGINS — comma list for WebSocket origin checks\u003c/li>\u003cli>QUIZHUB_TRUST_PROXY — set to true if behind a trusted proxy\u003c/li>\u003c/ul>\n\u003ch2>Troubleshooting quick fixes\u003c/h2>\n\u003cul>\u003cli>bind: address already in use → change port: \u003ccode>QUIZHUB_PORT=3000 ./quizhub\u003c/code>\u003c/li>\u003cli>WebSocket not connecting → ensure your reverse proxy forwards Upgrade headers (see README.md)\u003c/li>\u003c/ul>\n\u003cp>Where to look in code:\u003c/p>\n\u003cul>\u003cli>entry: cmd/server/main.go\u003c/li>\u003cli>DB layer: internal/db/db.go\u003c/li>\u003cli>HTTP handlers: internal/handlers/handlers.go\u003c/li>\u003cli>WebSocket: internal/ws/hub.go\u003c/li>\u003cli>Frontend files: web/static/\u003cem>.html, web/static/\u003c/em>.js\u003c/li>\u003c/ul>"},{"id":"architecture","icon":"🏛️","title":"Architecture","source":"ARCHITECTURE.md","hasContent":true,"summary":"This is a small single-binary web app that embeds its frontend and uses an embedded SQLite DB. It runs an HTTP server and a WebSocket hub to keep players in sync in real time.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Architecture\u003c/h1>\n\u003cp>This is a small single-binary web app that embeds its frontend and uses an embedded SQLite DB. It runs an HTTP server and a WebSocket hub to keep players in sync in real time.\u003c/p>\n\u003ch2>Major components\u003c/h2>\n\u003ctable class=\"md-table\">\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Component\u003c/th>\u003cth style=\"text-align:left\">Where in code\u003c/th>\u003cth style=\"text-align:left\">Responsibility\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">Server entry\u003c/td>\u003ctd style=\"text-align:left\">cmd/server/main.go\u003c/td>\u003ctd style=\"text-align:left\">Wire up DB, WebSocket hub, handlers, middleware, and serve embedded static files.\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Database layer\u003c/td>\u003ctd style=\"text-align:left\">internal/db/db.go\u003c/td>\u003ctd style=\"text-align:left\">SQLite migrations, queries, players/questions/answers, game state.\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">HTTP handlers\u003c/td>\u003ctd style=\"text-align:left\">internal/handlers/handlers.go\u003c/td>\u003ctd style=\"text-align:left\">API endpoints, admin auth, game lifecycle, timers.\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">WebSocket hub\u003c/td>\u003ctd style=\"text-align:left\">internal/ws/hub.go\u003c/td>\u003ctd style=\"text-align:left\">Manage connections, broadcast events to players/admin.\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Embedded frontend\u003c/td>\u003ctd style=\"text-align:left\">web/embed.go + web/static/*\u003c/td>\u003ctd style=\"text-align:left\">Player and admin UI served from the binary (go:embed).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Request / data flow (common scenarios)\u003c/h2>\n\u003ch3>Player joining\u003c/h3>\n\u003col>\u003cli>Player opens \u003ccode>/\u003c/code> → static page served.\u003c/li>\u003cli>Frontend posts to \u003ccode>POST /api/join\u003c/code> with room_code and nickname.\u003c/li>\u003cli>handlers.Join validates room, creates player via DB.CreatePlayer, broadcasts \u003ccode>player_joined\u003c/code> via hub.\u003c/li>\u003cli>Frontend opens WebSocket \u003ccode>/api/ws?role=player&amp;player_id=...\u003c/code> to receive live events.\u003c/li>\u003c/ol>\n\u003ch3>Admin creating a room\u003c/h3>\n\u003col>\u003cli>Admin hits \u003ccode>/admin.html\u003c/code> and authenticates with PIN via \u003ccode>POST /api/admin/auth\u003c/code>.\u003c/li>\u003cli>Admin requests \u003ccode>POST /api/room/create\u003c/code> → server generates a room code and sets game_state in DB.\u003c/li>\u003cli>Hub broadcasts \u003ccode>room_created\u003c/code> to clients.\u003c/li>\u003c/ol>\n\u003ch3>Game start and question flow\u003c/h3>\n\u003col>\u003cli>Admin selects questions and calls \u003ccode>POST /api/game/start\u003c/code>.\u003c/li>\u003cli>DB.StartGame sets game state and handlers.startQuestion broadcasts \u003ccode>new_question\u003c/code>.\u003c/li>\u003cli>Players submit answers to \u003ccode>POST /api/answer\u003c/code>; DB records answers and updates scores.\u003c/li>\u003cli>After time limit, handlers.auto-reveal triggers \u003ccode>time_up\u003c/code> and admin advances with \u003ccode>POST /api/game/next\u003c/code>.\u003c/li>\u003c/ol>\n\u003ch2>Key boundaries\u003c/h2>\n\u003cul>\u003cli>No external DB or services required—the app embeds SQLite.\u003c/li>\u003cli>WebSocket is the live sync channel; REST API is used for state changes and queries.\u003c/li>\u003cli>Admin actions require \u003ccode>X-Admin-Token\u003c/code> header or admin_token query param for WS.\u003c/li>\u003c/ul>\n\u003cp>Where to dig deeper: start at cmd/server/main.go, then handlers, then db and ws packages.\u003c/p>"},{"id":"integrations","icon":"🔌","title":"Integrations","source":"INTEGRATIONS.md","hasContent":true,"summary":"This project aims for zero external runtime dependencies. The only runtime integrations are environment-configured behaviors and optional reverse proxies.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>External Integrations\u003c/h1>\n\u003cp>This project aims for zero external runtime dependencies. The only runtime integrations are environment-configured behaviors and optional reverse proxies.\u003c/p>\n\u003ctable class=\"md-table\">\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Service\u003c/th>\u003cth style=\"text-align:left\">What it&#39;s used for\u003c/th>\u003cth style=\"text-align:left\">Where configured\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">SQLite (embedded)\u003c/td>\u003ctd style=\"text-align:left\">Persistent storage for players, questions, answers, game_state\u003c/td>\u003ctd style=\"text-align:left\">internal/db/db.go (migrations); QUIZHUB_DB env var in cmd/server/main.go\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Reverse proxy / TLS\u003c/td>\u003ctd style=\"text-align:left\">Optional: Nginx/Caddy in front to provide HTTPS and proxy WebSocket Upgrade headers\u003c/td>\u003ctd style=\"text-align:left\">Deployment notes in README.md and Docker compose example (docker-compose.yml / fly.toml)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Environment variables (where to set)\u003c/h2>\n\u003cul>\u003cli>QUIZHUB_PORT — server port (cmd/server/main.go)\u003c/li>\u003cli>QUIZHUB_DB — SQLite file path (cmd/server/main.go)\u003c/li>\u003cli>QUIZHUB_ADMIN_PIN — admin PIN (handlers.New)\u003c/li>\u003cli>QUIZHUB_ADMIN_TOKEN_TTL_MIN — admin token TTL in minutes (handlers.New)\u003c/li>\u003cli>QUIZHUB_ALLOWED_ORIGINS — comma-separated origins for WebSocket (internal/ws/isAllowedOrigin)\u003c/li>\u003cli>QUIZHUB_TRUST_PROXY — if true, use X-Forwarded-For for client IP (handlers.New)\u003c/li>\u003c/ul>\n\u003cp>Notes:\u003c/p>\n\u003cul>\u003cli>No external secrets store is required. If you deploy behind a reverse proxy, configure HTTPS there and ensure Upgrade headers are forwarded for WebSockets.\u003c/li>\u003c/ul>"},{"id":"links","icon":"🔗","title":"Curated Links","source":"LINKS.md","hasContent":true,"summary":"Add a link from the terminal:","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Important Links\u003c/h1>\n\u003cblockquote>External docs, design docs, runbooks, dashboards — anything a teammate would want to know about.\u003c/blockquote>\n\u003cp>Add a link from the terminal:\u003c/p>\n\u003cpre class=\"code\">\u003ccode data-lang=\"bash\">buddy link https://example.com/doc --title &quot;Payments design&quot; --tags architecture,payments --relevance must-read\u003c/code>\u003c/pre>\n\u003cp>Or ask Buddy in Copilot CLI: \u003cem>&quot;here&#39;s a link: https://… it&#39;s our oncall runbook.&quot;\u003c/em>\u003c/p>\n\u003cblockquote>⚠️ Buddy never reads the linked page. It only stores metadata. If you want a summary, paste the contents into the chat.\u003c/blockquote>\n\u003chr/>\n\u003ch2>Must-read\u003c/h2>\n\u003cp>\u003cem>(none yet)\u003c/em>\u003c/p>\n\u003ch2>Helpful\u003c/h2>\n\u003cp>\u003cem>(none yet)\u003c/em>\u003c/p>\n\u003ch2>Optional\u003c/h2>\n\u003cp>\u003cem>(none yet)\u003c/em>\u003c/p>"},{"id":"changelog","icon":"📜","title":"Recent Changes","source":"CHANGELOG_SUMMARY.md","hasContent":true,"summary":"A short, human-friendly summary of the last commits (most recent first):","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Recent Changes (Human-Friendly)\u003c/h1>\n\u003cp>A short, human-friendly summary of the last commits (most recent first):\u003c/p>\n\u003cul>\u003cli>buddy: update README_FOR_HUMANS and manifest (f8583b4) — small Buddy docs update (2026-05-24).\u003c/li>\u003cli>Add admin reset session button (a9877cf) — UI: admin can reset session (2026-05-16).\u003c/li>\u003cli>Merge: fix bugs in live container deployment (8f9b1a1 / 465eeb7) — deployment fixes merged (2026-05-13).\u003c/li>\u003cli>Format handlers tests to satisfy gofmt CI (f9f9f4d) — formatting and CI adjustments (2026-05-13).\u003c/li>\u003cli>Fix pre-existing handler/db compile issues and stabilize tests (c702ff8) — bug fixes and test stabilization (2026-05-13).\u003c/li>\u003cli>Add always-available admin End Game reset action (7541935) — admin control improvement (2026-05-13).\u003c/li>\u003cli>Fix CI: tidy go.sum (f2be92f) — dependency tidying (2026-05-09).\u003c/li>\u003c/ul>\n\u003cp>If you want a fuller changelog, say &quot;Expand changelog to X commits&quot;.\u003c/p>"},{"id":"starter","icon":"🎯","title":"Starter Tasks","source":"STARTER_TASKS.md","hasContent":true,"summary":"Short, safe tasks for your first contributions. Pick one. Do it. Open a small PR.","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Starter Tasks\u003c/h1>\n\u003cp>Short, safe tasks for your first contributions. Pick one. Do it. Open a small PR.\u003c/p>\n\u003ch2>Quick wins (10–30 minutes)\u003c/h2>\n\u003cul>\u003cli>Run the app locally:\u003c/li>\u003cli>\u003ccode>make build\u003c/code> then \u003ccode>./quizhub\u003c/code> or \u003ccode>make run\u003c/code>.\u003c/li>\u003cli>Open http://localhost:8080 and http://localhost:8080/admin.html (PIN: 1234).\u003c/li>\u003cli>File to check: cmd/server/main.go\u003c/li>\u003c/ul>\n\u003cul>\u003cli>Run tests:\u003c/li>\u003cli>\u003ccode>make test\u003c/code>\u003c/li>\u003cli>If a test fails, copy the failing output and open an issue or PR that fixes a small cause.\u003c/li>\u003cli>Files to check: internal/db/db_test.go, internal/handlers/handlers_test.go\u003c/li>\u003c/ul>\n\u003cul>\u003cli>Fix a doc typo:\u003c/li>\u003cli>Look for small wording issues in README.md or .buddy/*.md and submit a one-line change.\u003c/li>\u003c/ul>\n\u003ch2>Small coding tasks (30–90 minutes)\u003c/h2>\n\u003cul>\u003cli>Add a unit test for a DB helper or handler endpoint.\u003c/li>\u003cli>Pick a function in internal/db or internal/handlers with no tests and add a test.\u003c/li>\u003cli>Run \u003ccode>make test\u003c/code> until it passes.\u003c/li>\u003c/ul>\n\u003cul>\u003cli>Improve an error or log message.\u003c/li>\u003cli>Search for confusing logs (e.g., generic &quot;failed&quot; messages) and make them clearer.\u003c/li>\u003cli>File to edit: internal/db/db.go or internal/handlers/handlers.go\u003c/li>\u003c/ul>\n\u003cul>\u003cli>Add a missing HTTP validation case.\u003c/li>\u003cli>Example: find an input that isn&#39;t checked and add a handler-side check and test.\u003c/li>\u003c/ul>\n\u003ch2>Learning tasks (1–3 hours)\u003c/h2>\n\u003cul>\u003cli>Trace the WebSocket flow end-to-end.\u003c/li>\u003cli>Start at internal/ws/hub.go, then handlers.HandleWS and handlers.startQuestion.\u003c/li>\u003cli>Add a short comment in the code explaining the flow.\u003c/li>\u003c/ul>\n\u003cul>\u003cli>Improve the README example that shows how to deploy with Docker or systemd.\u003c/li>\u003cli>Make one small change that clarifies a command or environment variable.\u003c/li>\u003c/ul>\n\u003ch2>Where to look (file hints)\u003c/h2>\n\u003cul>\u003cli>Program start: cmd/server/main.go\u003c/li>\u003cli>Handlers and API: internal/handlers/handlers.go\u003c/li>\u003cli>DB logic &amp; migrations: internal/db/db.go\u003c/li>\u003cli>WebSocket hub: internal/ws/hub.go\u003c/li>\u003cli>Frontend (embedded): web/static/* and web/embed.go\u003c/li>\u003cli>Build &amp; tasks: Makefile, Dockerfile, .github/workflows/go.yml\u003c/li>\u003c/ul>\n\u003ch2>How to make a tiny PR\u003c/h2>\n\u003col>\u003cli>Create a topic branch: \u003ccode>git checkout -b fix/readme-typo\u003c/code>\u003c/li>\u003cli>Make the small change.\u003c/li>\u003cli>Run \u003ccode>make test\u003c/code>.\u003c/li>\u003cli>Commit and push. Open a PR with 1–3 sentences explaining why.\u003c/li>\u003c/ol>\n\u003ch2>If you get stuck\u003c/h2>\n\u003cul>\u003cli>Post the failing command and the exact error text in your team chat.\u003c/li>\u003cli>Point to the file you edited and the tests you ran.\u003c/li>\u003c/ul>\n\u003cp>Next step: Run one quick win now (run app or tests). When done, tell Buddy and I will suggest a follow-up starter task.\u003c/p>\u003ch2>From the code\u003c/h2>\u003cp>No \u003ccode>TODO\u003c/code> / \u003ccode>FIXME\u003c/code> comments found. Nice and tidy! Pick a warm-up task above instead.\u003c/p>"},{"id":"questions","icon":"❓","title":"Open Questions","source":"NOTES/open_questions.md","hasContent":true,"summary":"(none yet)","html":"\u003cp>🏠 \u003ca href=\"#welcome\" data-tour-link=\"1\">Home\u003c/a> · \u003ca href=\"#getting\" data-tour-link=\"1\">Getting Started\u003c/a> · \u003ca href=\"#architecture\" data-tour-link=\"1\">Architecture\u003c/a> · \u003ca href=\"#tech\" data-tour-link=\"1\">Tech\u003c/a> · \u003ca href=\"#integrations\" data-tour-link=\"1\">Integrations\u003c/a> · \u003ca href=\"#map\" data-tour-link=\"1\">Repo Map\u003c/a> · \u003ca href=\"#links\" data-tour-link=\"1\">Links\u003c/a>\u003c/p>\n\u003chr/>\n\u003ch1>Open Questions\u003c/h1>\n\u003cblockquote>Things Buddy couldn&#39;t figure out from the repo alone. Help fill these in!\u003c/blockquote>\n\u003cp>\u003cem>(none yet)\u003c/em>\u003c/p>"}],"quiz":[{"q":"Which language is used in this repo?","choices":["C#","TypeScript","JavaScript","PHP"],"answer":2},{"q":"Which build or package tool is used here?","choices":["maven","gradle","cargo","npm"],"answer":3},{"q":"Which command should you run first to set this repo up locally?","choices":["./configure && make","yarn install","cargo build","git clone https://github.com/sakh1l/quizhub.git"],"answer":3},{"q":"Which of these is an actual component described in this repo's architecture?","choices":["Major components","Quantum Flux Capacitor","Imaginary Friend Daemon","Coffee-Powered Reactor"],"answer":0}],"links":[]}</script>
<script>
(function(){
  const raw = document.getElementById('buddy-data').textContent;
  const DATA = JSON.parse(raw);
  const STORAGE_KEY = 'buddy-tour:' + (DATA.meta.repoName || 'repo');
  const state = loadState();

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { done: {}, quiz: null }; }
    catch { return { done: {}, quiz: null }; }
  }
  function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} }

  const ALL_STEPS = DATA.sections.concat([
    { id: '__quiz__', icon: '🎓', title: 'Graduation Quiz', isQuiz: true, hasContent: true },
  ]);

  document.getElementById('repoName').textContent = '📦 ' + (DATA.meta.repoName || 'repo');

  const nav = document.getElementById('nav');
  ALL_STEPS.forEach((s, idx) => {
    const b = document.createElement('button');
    b.dataset.id = s.id;
    b.innerHTML = '<span>' + s.icon + '</span><span>' + (idx + 1) + '. ' + escapeHtml(s.title) + '</span>'
      + (s.hasContent ? '' : '<span class="empty-tag">empty</span>')
      + '<span class="check">✓</span>';
    b.onclick = () => navigate(s.id);
    nav.appendChild(b);
  });

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function refreshNav() {
    const total = ALL_STEPS.length;
    let done = 0;
    Array.from(nav.children).forEach((btn) => {
      const id = btn.dataset.id;
      if (state.done[id]) { btn.classList.add('done'); done++; }
      else btn.classList.remove('done');
      btn.classList.toggle('active', id === currentId);
    });
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById('xpBar').style.width = pct + '%';
    document.getElementById('xpText').textContent =
      done + ' / ' + total + ' steps complete  •  ' + pct + ' XP';
  }

  let currentId = ALL_STEPS[0].id;
  function navigate(id) {
    currentId = id;
    if (id === '__quiz__') renderQuiz();
    else renderSection(DATA.sections.find((x) => x.id === id));
    refreshNav();
    history.replaceState(null, '', '#' + id);
  }

  function markDone(id) { state.done[id] = true; saveState(); refreshNav(); }

  function renderSection(s) {
    const idx = ALL_STEPS.findIndex((x) => x.id === s.id);
    const next = ALL_STEPS[idx + 1];
    const main = document.getElementById('main');

    // Special, more visual rendering for the Curated Links page.
    let body;
    if (s.id === 'links' && Array.isArray(DATA.links) && DATA.links.length) {
      body = renderLinksGrid(DATA.links);
    } else if (s.hasContent) {
      body = '<div class="content">' + s.html + '</div>';
    } else {
      body = '<div class="empty"><strong>This section is empty.</strong> Ask Buddy in your CLI: '
           + '<code>"Scan this repo and fill in .buddy/' + escapeHtml(s.source) + '"</code>.</div>';
    }

    main.innerHTML =
      '<div class="crumb">Step ' + (idx + 1) + ' of ' + ALL_STEPS.length + '</div>'
      + '<h1 class="pageTitle"><span class="icon">' + s.icon + '</span>'
      + escapeHtml(s.title) + '</h1>'
      + (s.summary ? '<div class="tldr"><div class="label">In one line</div>' + escapeHtml(s.summary) + '</div>' : '')
      + '<div class="src-link">📖 Source: <code>.buddy/' + escapeHtml(s.source) + '</code></div>'
      + body
      + '<div class="actions">'
      + '<button class="btn" id="btnDone">' + (state.done[s.id] ? '✓ Marked complete' : 'Mark complete & continue') + '</button>'
      + (next ? '<button class="btn ghost" id="btnNext">Next: ' + escapeHtml(next.title) + ' →</button>' : '')
      + '</div>'
      + '<div class="footer">Generated ' + new Date(DATA.meta.generatedAt).toLocaleString()
      + (DATA.meta.lastIndexedCommit ? ' • Indexed commit ' + DATA.meta.lastIndexedCommit.slice(0,8) : '')
      + '</div>';

    document.getElementById('btnDone').onclick = function(){
      markDone(s.id);
      if (next) navigate(next.id);
    };
    if (next) document.getElementById('btnNext').onclick = function(){
      markDone(s.id); navigate(next.id);
    };
    accordionizeContent(main);
    addCopyButtons(main);
    wireInternalLinks(main);
  }

  // Track scroll listener cleanup so navigating between sidebar sections
  // doesn't leave stale handlers attached to detached DOM.
  let scrollCleanup = null;

  function renderLinksGrid(links) {
    const cards = links.map((l) => {
      const tagPills = (l.tags || []).map((t) =>
        '<span class="pill">' + escapeHtml(t) + '</span>').join('');
      const relPill = '<span class="pill ' + (l.relevance === 'must-read' ? 'must' :
        l.relevance === 'optional' ? 'optional' : '') + '">'
        + escapeHtml(l.relevance || 'helpful') + '</span>';
      const safeUrl = /^(https?:|mailto:)/i.test(l.url || '') ? l.url : '#';
      return '<a class="link-card" href="' + escapeHtml(safeUrl) + '" target="_blank" rel="noopener">'
        + '<div class="title">🔗 ' + escapeHtml(l.title) + '</div>'
        + (l.description ? '<div class="desc">' + escapeHtml(l.description) + '</div>' : '')
        + '<div class="meta">' + relPill + tagPills + '</div>'
        + '</a>';
    }).join('');
    return '<div class="link-grid">' + cards + '</div>';
  }

  // Wrap H2 sections of rendered markdown into <details> accordions.
  // First accordion is open by default so the page never looks empty.
  function accordionizeContent(root) {
    const content = root.querySelector('.content');
    if (!content) return;
    const children = Array.from(content.children);
    if (children.filter((c) => c.tagName === 'H2').length < 2) return;
    // Unique group name so opening one card auto-closes its siblings
    // (native exclusive-accordion behavior in modern browsers).
    const groupName = 'acc-' + Math.random().toString(36).slice(2, 9);
    const frag = document.createDocumentFragment();
    const detailsList = [];
    let bucket = null;
    let firstOpen = true;
    for (const el of children) {
      if (el.tagName === 'H2') {
        const det = document.createElement('details');
        det.name = groupName;
        if (firstOpen) { det.open = true; firstOpen = false; }
        const sum = document.createElement('summary');
        sum.innerHTML = el.innerHTML;
        const accBody = document.createElement('div');
        accBody.className = 'acc-body';
        det.appendChild(sum);
        det.appendChild(accBody);
        frag.appendChild(det);
        detailsList.push(det);
        bucket = accBody;
      } else if (bucket) {
        bucket.appendChild(el);
      } else {
        frag.appendChild(el);
      }
    }
    content.innerHTML = '';
    content.appendChild(frag);
    // Fallback for browsers without exclusive <details name=...> support.
    detailsList.forEach((d) => {
      d.addEventListener('toggle', () => {
        if (!d.open) return;
        detailsList.forEach((o) => { if (o !== d && o.open) o.open = false; });
      });
    });
    // Auto-open the section the user scrolls to. Driven by real scroll
    // events (not IntersectionObserver), so layout shifts caused by
    // opening a card do not re-trigger and fight the user's clicks.
    if (scrollCleanup) { scrollCleanup(); scrollCleanup = null; }
    let userClickLock = 0;
    let lastAdvanceAt = 0;
    let wheelAccum = 0;
    detailsList.forEach((d) => {
      const sum = d.querySelector('summary');
      if (sum) {
        sum.addEventListener('click', () => {
          // Briefly ignore scroll-driven auto-open after a manual click,
          // so the user's choice sticks even if the page reflows.
          userClickLock = Date.now() + 800;
          wheelAccum = 0;
        });
      }
    });
    function handoff(dir) {
      const now = Date.now();
      if (now < userClickLock) return;
      if (now - lastAdvanceAt < 250) return;
      const openIdx = detailsList.findIndex((d) => d.open);
      if (openIdx === -1) { detailsList[0].open = true; return; }
      if (dir > 0) {
        const next = detailsList[openIdx + 1];
        if (next) { next.open = true; lastAdvanceAt = now; }
      } else if (dir < 0) {
        const prev = detailsList[openIdx - 1];
        if (prev) { prev.open = true; lastAdvanceAt = now; }
      }
    }
    function onWheel(e) {
      // Wheel events fire even when the page is not scrollable, so this is
      // the most reliable signal. Accumulate deltaY and hand off when it
      // crosses a threshold — this also debounces trackpad inertia.
      wheelAccum += e.deltaY;
      if (Math.abs(wheelAccum) >= 80) {
        const dir = wheelAccum > 0 ? 1 : -1;
        wheelAccum = 0;
        handoff(dir);
      }
    }
    function onKey(e) {
      if (['ArrowDown','PageDown','End',' '].includes(e.key)) handoff(1);
      else if (['ArrowUp','PageUp','Home'].includes(e.key)) handoff(-1);
    }
    // Also keep a scroll-based path: on scrollable pages, when the open
    // card's body scrolls out of view, advance. This complements wheel
    // accumulation for users who scroll via scrollbar / middle-click.
    let prevScrollY = window.scrollY;
    function onScroll() {
      const y = window.scrollY;
      const dy = y - prevScrollY;
      prevScrollY = y;
      if (Date.now() < userClickLock) return;
      if (Date.now() - lastAdvanceAt < 250) return;
      const openIdx = detailsList.findIndex((d) => d.open);
      if (openIdx === -1) return;
      const open = detailsList[openIdx];
      const r = open.getBoundingClientRect();
      const vh = window.innerHeight;
      if (dy > 0) {
        const next = detailsList[openIdx + 1];
        if (next && r.bottom < vh * 0.35) handoff(1);
      } else if (dy < 0) {
        const prev = detailsList[openIdx - 1];
        if (prev && r.top > vh * 0.55) handoff(-1);
      }
    }
    const targets = [window, document, document.documentElement, document.body];
    targets.forEach((t) => t.addEventListener('scroll', onScroll, { passive: true }));
    window.addEventListener('wheel', onWheel, { passive: true });
    window.addEventListener('keydown', onKey);
    scrollCleanup = () => {
      targets.forEach((t) => t.removeEventListener('scroll', onScroll));
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('keydown', onKey);
    };
  }

  function wireInternalLinks(root) {
    root.querySelectorAll('a[data-tour-link="1"]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const id = (a.getAttribute('href') || '').replace('#', '');
        if (id) navigate(id);
      });
    });
  }

  function addCopyButtons(root) {
    root.querySelectorAll('pre.code').forEach((pre) => {
      if (pre.querySelector('.copy')) return;
      const btn = document.createElement('button');
      btn.className = 'copy';
      btn.textContent = 'Copy';
      btn.onclick = () => {
        const txt = pre.querySelector('code').innerText;
        navigator.clipboard?.writeText(txt);
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
      };
      pre.appendChild(btn);
    });
  }

  function renderQuiz() {
    const main = document.getElementById('main');
    state.quiz = state.quiz || { answers: {} };
    let html = '<div class="crumb">Final step</div>'
      + '<h1 class="pageTitle"><span class="icon">🎓</span>Graduation Quiz</h1>'
      + '<div class="summary">Answer a few quick questions to earn your Buddy Graduate badge.</div>';
    DATA.quiz.forEach((q, qi) => {
      html += '<div class="quiz-q" data-qi="' + qi + '"><div class="q">'
        + (qi + 1) + '. ' + escapeHtml(q.q) + '</div>';
      q.choices.forEach((c, ci) => {
        html += '<button class="opt" data-ci="' + ci + '">' + escapeHtml(c) + '</button>';
      });
      html += '</div>';
    });
    html += '<div class="quiz-score" id="score"></div>';
    html += '<div class="actions"><button class="btn warm" id="btnFinish">Finish & earn badge 🎉</button></div>';
    main.innerHTML = html;

    main.querySelectorAll('.quiz-q').forEach((qEl) => {
      const qi = +qEl.dataset.qi;
      qEl.querySelectorAll('.opt').forEach((opt) => {
        opt.onclick = () => {
          const ci = +opt.dataset.ci;
          state.quiz.answers[qi] = ci;
          saveState();
          qEl.querySelectorAll('.opt').forEach((o) => o.classList.remove('right','wrong'));
          opt.classList.add(ci === DATA.quiz[qi].answer ? 'right' : 'wrong');
          if (ci !== DATA.quiz[qi].answer) {
            const correct = qEl.querySelectorAll('.opt')[DATA.quiz[qi].answer];
            if (correct) correct.classList.add('right');
          }
          updateScore();
        };
        // Restore prior selection
        if (state.quiz.answers[qi] === +opt.dataset.ci) opt.click();
      });
    });
    function updateScore() {
      let correct = 0;
      DATA.quiz.forEach((q, i) => { if (state.quiz.answers[i] === q.answer) correct++; });
      document.getElementById('score').textContent =
        'Score: ' + correct + ' / ' + DATA.quiz.length
        + (correct === DATA.quiz.length ? '  🌟 Perfect!' : '');
    }
    updateScore();
    document.getElementById('btnFinish').onclick = () => {
      markDone('__quiz__');
      alert('🎉 You finished the Buddy Tour!\nYou are ready to ship your first contribution.');
    };
  }

  // Search across all sections.
  document.getElementById('search').addEventListener('input', (e) => {
    const term = e.target.value.trim().toLowerCase();
    if (!term) { navigate(currentId); return; }
    const main = document.getElementById('main');
    const hits = [];
    DATA.sections.forEach((s) => {
      const txt = (s.title + ' ' + s.summary + ' ' + s.html).toLowerCase();
      if (txt.includes(term)) hits.push(s);
    });
    main.innerHTML = '<h1 class="pageTitle"><span class="icon">🔎</span>Search: ' + escapeHtml(term) + '</h1>'
      + '<div class="search-hits">' + hits.length + ' section(s) match.</div>'
      + hits.map((s) => '<div class="quiz-q" style="cursor:pointer" data-id="' + s.id + '">'
        + '<div class="q">' + s.icon + ' ' + escapeHtml(s.title) + '</div>'
        + '<div style="color:var(--muted);font-size:13px">' + escapeHtml(s.summary || '(open to view)') + '</div></div>').join('');
    main.querySelectorAll('[data-id]').forEach((el) => {
      el.onclick = () => { document.getElementById('search').value = ''; navigate(el.dataset.id); };
    });
  });

  // Start: honor URL hash if present.
  const hash = (location.hash || '').replace('#','');
  const start = ALL_STEPS.find((s) => s.id === hash) ? hash : ALL_STEPS[0].id;
  navigate(start);
})();
</script>
</body>
</html>
